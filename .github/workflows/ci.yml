name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uvx ruff@0.17.0 check .
      - run: uvx ruff@0.17.0 format --check .
      - run: uv run --group dev pytest -q
      - name: rules check on every scenario
        # The rules don't solve every scenario, so the eval exits 1 by design;
        # this only checks that it runs.
        run: uv run bumpscout eval --model rules || test $? -eq 1
